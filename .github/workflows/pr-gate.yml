name: PR Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    name: PR Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
