name: Sync private issue state to public tracker

on:
  workflow_call:
    inputs:
      public_repository:
        description: Public issue-tracking repository in owner/name format.
        required: true
        type: string
    secrets:
      issue_sync_token:
        description: Token with Issues read and write access to the public repository.
        required: true

permissions:
  contents: read
  issues: read

concurrency:
  group: issue-sync-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync-private-issue-state:
    name: Update public issue state
    if: ${{ github.event_name == 'issues' && github.event.issue.number != null }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Update public issue state
        env:
          GH_TOKEN: ${{ secrets.issue_sync_token }}
          EXPECTED_PUBLIC_REPOSITORY: ${{ inputs.public_repository }}
          PRIVATE_ISSUE_BODY: ${{ github.event.issue.body }}
          PRIVATE_ISSUE_STATE: ${{ github.event.issue.state }}
        run: |
          set -euo pipefail

          source_reference="$(
            jq -rn --arg body "$PRIVATE_ISSUE_BODY" '
              try (
                $body
                | capture(
                    "^<!-- issue-sync-source: (?<repository>[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)#(?<number>[0-9]+) -->"
                  )
              ) catch empty
            '
          )"

          if [[ -z "$source_reference" ]]; then
            echo "This issue is not a synchronized public issue."
            exit 0
          fi

          source_repository="$(jq -r '.repository' <<< "$source_reference")"
          source_number="$(jq -r '.number' <<< "$source_reference")"

          if [[ "$source_repository" != "$EXPECTED_PUBLIC_REPOSITORY" ]]; then
            echo "The source marker does not match $EXPECTED_PUBLIC_REPOSITORY." >&2
            exit 1
          fi

          gh api \
            --method PATCH \
            "repos/$source_repository/issues/$source_number" \
            --raw-field state="$PRIVATE_ISSUE_STATE" \
            >/dev/null

          {
            echo "### Public issue sync"
            echo
            echo "Set \`$source_repository#$source_number\` to \`$PRIVATE_ISSUE_STATE\`."
          } >> "$GITHUB_STEP_SUMMARY"
